<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Budget Update</title>
</head>
<body>
  <h2>Hi {{ name }}!</h2>
  <p>Here’s a quick snapshot of your wedding budget in {{ city }}:</p>
  <ul>
  {% for category, amount in allocated_budget.items() %}
    <li>{{ category | capitalize }}: ₹{{ amount }}</li>
  {% endfor %}
  </ul>
  <a href="{{ site_url }}/budget-planner">Update Your Budget</a>
  <p>Keep your finances on track for a dream wedding!</p>
</body>
</html>
